[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-harness-tut2"
version = "0.1.0"
description = "Minimal offline agent harness for tutorial work"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "AI Harness Tutorial" }]
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["harness*"]
